<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f1a4a"/>
      <stop offset=".5" stop-color="#080d26"/>
      <stop offset="1" stop-color="#1e0a3c"/>
    </linearGradient>
    <radialGradient id="aura" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#3b82f6" stop-opacity=".55"/>
      <stop offset=".6" stop-color="#7c3aed" stop-opacity=".18"/>
      <stop offset="1" stop-color="#7c3aed" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#67e8f9"/>
      <stop offset=".55" stop-color="#60a5fa"/>
      <stop offset="1" stop-color="#c084fc"/>
    </linearGradient>
    <linearGradient id="shieldFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#16245e" stop-opacity=".92"/>
      <stop offset="1" stop-color="#0a0f2e" stop-opacity=".96"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".26"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="barIn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".22"/>
      <stop offset="1" stop-color="#fff" stop-opacity=".05"/>
    </linearGradient>
    <linearGradient id="edgeFade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset=".16" stop-color="#fff" stop-opacity="1"/>
      <stop offset=".84" stop-color="#fff" stop-opacity="1"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <mask id="edges"><rect width="512" height="512" fill="url(#edgeFade)"/></mask>
    <linearGradient id="red" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ff5c66"/><stop offset="1" stop-color="#d1061b"/></linearGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5eead4"/><stop offset="1" stop-color="#0891b2"/></linearGradient>
    <linearGradient id="violet" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#c4b5fd"/><stop offset="1" stop-color="#7c3aed"/></linearGradient>
    <filter id="blur12" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="12"/></filter>
    <filter id="blur6" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="6"/></filter>
    <clipPath id="tile"><rect width="512" height="512" rx="116"/></clipPath>
    <path id="shield" d="M256 78 L402 128 V240 C402 340 340 406 256 442 C172 406 110 340 110 240 V128 Z"/>
    <clipPath id="inShield"><use href="#shield"/></clipPath>
    <!-- one set of ticker bars, drawn twice: dim outside the shield, bright inside -->
    <g id="bars">
      <rect x="-20" y="164" width="552" height="54" rx="16"/>
      <rect x="-20" y="232" width="552" height="54" rx="16"/>
      <rect x="-20" y="300" width="552" height="54" rx="16"/>
    </g>
  </defs>

  <g clip-path="url(#tile)">
    <rect width="512" height="512" fill="url(#bg)"/>
    <circle cx="256" cy="262" r="250" fill="url(#aura)"/>

    <!-- headlines streaming past outside the shield -->
    <g mask="url(#edges)">
      <use href="#bars" fill="#fff" opacity=".07"/>
      <rect x="20" y="183" width="60" height="16" rx="8" fill="#ff6b74" opacity=".55"/>
      <rect x="432" y="183" width="70" height="16" rx="8" fill="#fff" opacity=".3"/>
      <rect x="10" y="251" width="80" height="16" rx="8" fill="#fff" opacity=".28"/>
      <rect x="428" y="251" width="56" height="16" rx="8" fill="#5eead4" opacity=".45"/>
      <rect x="26" y="319" width="54" height="16" rx="8" fill="#c4b5fd" opacity=".45"/>
      <rect x="430" y="319" width="76" height="16" rx="8" fill="#fff" opacity=".26"/>
    </g>

    <!-- shield glow -->
    <use href="#shield" fill="none" stroke="#60a5fa" stroke-width="26" opacity=".55" filter="url(#blur12)"/>
    <use href="#shield" fill="url(#shieldFill)"/>

    <!-- bright bars inside the shield -->
    <g clip-path="url(#inShield)">
      <rect x="100" y="158" width="250" height="66" rx="20" fill="#ff2d3a" opacity=".5" filter="url(#blur12)"/>
      <use href="#bars" fill="url(#barIn)" stroke="#fff" stroke-opacity=".25" stroke-width="2"/>
      <path d="M96 164 H214 L198 218 H96 Z" fill="url(#red)"/>
      <rect x="212" y="183" width="104" height="16" rx="8" fill="#fff"/>
      <rect x="328" y="183" width="60" height="16" rx="8" fill="#fff" opacity=".55"/>
      <path d="M96 232 H184 L168 286 H96 Z" fill="url(#cyan)"/>
      <rect x="182" y="251" width="90" height="16" rx="8" fill="#fff" opacity=".92"/>
      <rect x="284" y="251" width="110" height="16" rx="8" fill="#fff" opacity=".5"/>
      <path d="M96 300 H180 L164 354 H96 Z" fill="url(#violet)"/>
      <rect x="178" y="319" width="112" height="16" rx="8" fill="#fff" opacity=".88"/>
      <rect x="302" y="319" width="62" height="16" rx="8" fill="#fff" opacity=".45"/>
      <!-- glass gloss on the upper half of the shield -->
      <ellipse cx="256" cy="96" rx="210" ry="120" fill="url(#gloss)"/>
    </g>

    <!-- neon rim -->
    <use href="#shield" fill="none" stroke="url(#rim)" stroke-width="12" stroke-linejoin="round"/>
    <use href="#shield" fill="none" stroke="#fff" stroke-opacity=".55" stroke-width="2.5" stroke-linejoin="round" transform="translate(256 260) scale(.955) translate(-256 -260)"/>

    <!-- LIVE broadcast mark crowning the shield -->
    <g transform="translate(256 80)">
      <circle r="40" fill="#ff2d3a" opacity=".55" filter="url(#blur12)"/>
      <circle r="27" fill="url(#red)" stroke="#fff" stroke-opacity=".7" stroke-width="3"/>
      <circle r="9" fill="#fff"/>
      <path d="M-15 -11 a19 19 0 0 0 0 22 M15 -11 a19 19 0 0 1 0 22" fill="none" stroke="#fff" stroke-width="4.5" stroke-linecap="round"/>
      <path d="M-50 -22 a52 52 0 0 0 0 44 M50 -22 a52 52 0 0 1 0 44" fill="none" stroke="#ff7a83" stroke-width="7" stroke-linecap="round"/>
      <path d="M-70 -34 a74 74 0 0 0 0 68 M70 -34 a74 74 0 0 1 0 68" fill="none" stroke="#ff7a83" stroke-width="6" stroke-linecap="round" opacity=".5"/>
    </g>
  </g>
  <rect x="2" y="2" width="508" height="508" rx="114" fill="none" stroke="#fff" stroke-opacity=".18" stroke-width="3"/>
</svg>
